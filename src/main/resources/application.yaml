server:
  port: 8081
  address: 0.0.0.0

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://192.168.1.2:8080/realms/miresta
  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/miresta
    username: postgres
    password: postgres

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173"